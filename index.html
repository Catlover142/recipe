
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>Freedom Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #071426, #102c50);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 35px;
      border-bottom: 1px solid #24466b;
      background: #091a30;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #65b5ff;
    }

    .status {
      color: #83d9a5;
      font-size: 13px;
    }

    main {
      width: min(700px, 90%);
      margin: 100px auto;
      text-align: center;
    }

    h1 {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #a9bfd9;
      margin-bottom: 35px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid #31577f;
      border-radius: 14px;
      background: #102944;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      outline: none;
      color: white;
      background: transparent;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 20px;
      color: white;
      background: #247ed1;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #3699f0;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 40px;
    }

    .shortcut {
      padding: 25px 10px;
      border: 1px solid #294c70;
      border-radius: 14px;
      background: #102944;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .shortcut:hover {
      transform: translateY(-4px);
      background: #193b60;
    }

    .shortcut .emoji {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }

    footer {
      margin-top: 65px;
      color: #829ab5;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 34px;
      }

      .shortcuts {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🌐 Freedom Browser</div>
    <div class="status">● Browser homepage</div>
  </header>

  <main>
    <h1>Explore Freely.</h1>
    <p class="subtitle">
      Welcome to your personal browsing homepage.
    </p>

    <form class="search-box" id="searchForm">
      <input
        id="searchInput"
        type="text"
        placeholder="Search the web..."
        autocomplete="off"
        required
      >
      <button type="submit">Search</button>
    </form>

    <div class="shortcuts">
      <a class="shortcut"
         href="https://www.google.com"
         target="_blank" rel="noopener noreferrer">
        <span class="emoji">🔎</span>
        Google
      </a>

      <a class="shortcut"
         href="https://www.youtube.com"
         target="_blank" rel="noopener noreferrer">
        <span class="emoji">▶️</span>
        YouTube
      </a>

      <a class="shortcut"
         href="https://www.wikipedia.org"
         target="_blank" rel="noopener noreferrer">
        <span class="emoji">📚</span>
        Wikipedia
      </a>
    </div>

    <footer>
      Freedom Browser · Personal browser homepage
    </footer>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) return;

      const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

      window.open(url, "_blank", "noopener,noreferrer");
    });
  </script>

</body>
</html>
